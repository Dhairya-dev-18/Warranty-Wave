services:
  database:
    image: mysql:8.4
    container_name: ww-mysql
    environment:
      MYSQL_DATABASE: warrantywave
      MYSQL_USER: warranty
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?Set MYSQL_PASSWORD in docker/.env}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Set MYSQL_ROOT_PASSWORD in docker/.env}
    ports:
      - "127.0.0.1:${MYSQL_PORT:-3306}:3306"
    volumes:
      - mysqldata:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p\"$$MYSQL_ROOT_PASSWORD\" --silent"]
      interval: 5s
      timeout: 5s
      retries: 10
  backend:
    build:
      context: ../backend
    environment:
      DB_URL: jdbc:mysql://database:3306/warrantywave?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
      DB_USER: warranty
      DB_PASSWORD: ${MYSQL_PASSWORD:?Set MYSQL_PASSWORD in docker/.env}
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in docker/.env}
      SPRING_PROFILES_ACTIVE: prod
    depends_on:
      database:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:8080/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    restart: unless-stopped
  frontend:
    build:
      context: ../frontend
    ports:
      - "${HTTP_PORT:-80}:80"
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped

volumes:
  mysqldata:
